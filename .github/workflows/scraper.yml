name: SIR Toscana – Aggiornamento dati pluviometrici

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora (minuto 0 di ogni ora)
  workflow_dispatch:       # permette lancio manuale dal pannello GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # necessario per fare commit nel repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze Python
        run: |
          pip install playwright beautifulsoup4

      - name: Installa Chromium per Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Esegui scraper SIR
        run: python scraper/sir_scraper_gha.py
        timeout-minutes: 10

      - name: Commit e push dati aggiornati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Commit solo se ci sono modifiche
          git diff --staged --quiet || git commit -m "dati SIR aggiornati: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
